<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NickStyle Name Generator</title>
</head>

<body>

<h2>NickStyle — 26,000 Name Generator</h2>

<button onclick="generateLibrary()">
Generate 26,000 Names
</button>

<a id="download" style="display:none;">
Download names.js
</a>

<script>

function generateLibrary(){

const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

/*
  Special styles.
  Har generated entry ka style combination
  unique rakha jayega.
*/

const symbols = [
"★","☆","✦","✧","✩","✪","✫","✬","✭","✮",
"♔","♕","♚","♛","♜","♝","♞",
"⚡","☄","☀","☾","☽","☯","☮","☘",
"☠","☢","☣","✿","❀","❁","❂","❃",
"❇","❈","❉","❊","❋","◆","◇","◈",
"◉","○","●","▲","△","▼","▽",
"✤","✥","✣","✢","✜","✚","✙",
"✠","✟","♠","♡","♢","♣","♥","♦",
"『","』","「","」","【","】","〖","〗",
"༺","༻","꧁","꧂","乂","亗","〆","メ","ツ","么","彡"
];

/*
  Number-free name parts
*/

const parts = [

"Alpha","Ace","Angel","Apex","Arrow",
"Aura","Aurora","Blaze","Blade","Bloom",
"Bolt","Boss","Brave","Crown","Cyber",
"Dawn","Demon","Dragon","Dream","Eagle",
"Echo","Elite","Ember","Falcon","Flash",
"Frost","Fury","Galaxy","Ghost","Glory",
"Hawk","Hero","Hunter","Icon","Inferno",
"Knight","Legend","Lion","Magic","Master",
"Meteor","Mystic","Ninja","Nova","Omega",
"Oracle","Phantom","Phoenix","Raven","Reaper",
"Royal","Shadow","Silver","Sniper","Spark",
"Storm","Titan","Thunder","Tiger","Viper",
"Vision","Warrior","Wolf","Wizard","Zenith"

];

const suffixes = [

"Star","Fire","Sky","Wave","Wing",
"Light","Rush","Soul","Force","Heart",
"Spirit","Dream","Crown","Strike","Flame",
"Storm","Frost","Glow","Legend","Royal",
"Shadow","Knight","Hunter","Dragon","Phoenix",
"Raven","Thunder","Blaze","Nova","Titan"

];

let usedNames = new Set();

let output =
"const nameLibrary = {\\n";

let styleIndex = 0;

for(let letter of alphabet){

output += `  ${letter}: [\\n`;

let letterNames = [];

let i = 0;

while(letterNames.length < 1000){

let part =
parts[(styleIndex + i) % parts.length];

let suffix =
suffixes[
Math.floor((styleIndex + i) / parts.length)
% suffixes.length
];

let core =
letter + part + suffix;

/*
  Unique special combination
*/

let left =
symbols[
styleIndex % symbols.length
];

let right =
symbols[
Math.floor(styleIndex / symbols.length)
% symbols.length
];

/*
  Avoid identical left/right symbols
*/

if(left === right){

right =
symbols[
(Math.floor(styleIndex / symbols.length) + 1)
% symbols.length
];

}

let finalName =
left + core + right;

/*
  Make absolutely sure
  no duplicate occurs.
*/

if(!usedNames.has(finalName)){

usedNames.add(finalName);

letterNames.push(finalName);

styleIndex++;

}

i++;

}

letterNames.forEach((name,index)=>{

let comma =
index < letterNames.length - 1
? ","
: "";

output +=
`    ${JSON.stringify(name)}${comma}\\n`;

});

output +=
`  ]${letter === "Z" ? "" : ","}\\n`;

}

output +=
"};\\n\\nwindow.nameLibrary = nameLibrary;\\n`;

/*
  Download names.js
*/

const blob =
new Blob(
[output],
{type:"application/javascript"}
);

const url =
URL.createObjectURL(blob);

const link =
document.getElementById("download");

link.href = url;

link.download = "names.js";

link.style.display = "inline-block";

link.style.marginTop = "20px";

link.innerText =
"⬇️ Download names.js";

alert(
"26,000 names ready! Ab Download names.js par click karo."
);

}

</script>

</body>
</html>
