<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NickStyle Name Generator</title>
</head>

<body>

<h2>NickStyle — 26,000 Name Generator</h2>

<button id="generateBtn">Generate 26,000 Names</button>

<p id="status"></p>

<a id="download" style="display:none;">
⬇️ Download names.js
</a>

<script>

document.getElementById("generateBtn").addEventListener("click", function(){

document.getElementById("status").innerText =
"Generating 26,000 names... Please wait.";

const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

const parts = [
"Alpha","Ace","Angel","Apex","Arrow","Aura","Aurora",
"Blaze","Blade","Bloom","Bolt","Boss","Brave","Crown",
"Cyber","Dawn","Demon","Dragon","Dream","Eagle","Echo",
"Elite","Ember","Falcon","Flash","Frost","Fury","Galaxy",
"Ghost","Glory","Hawk","Hero","Hunter","Icon","Inferno",
"Knight","Legend","Lion","Magic","Master","Meteor","Mystic",
"Ninja","Nova","Omega","Oracle","Phantom","Phoenix","Raven",
"Reaper","Royal","Shadow","Silver","Sniper","Spark","Storm",
"Titan","Thunder","Tiger","Viper","Vision","Warrior","Wolf",
"Wizard","Zenith"
];

const symbols = [
"★","☆","✦","✧","✩","✪","✫","✬","✭","✮",
"♔","♕","♚","♛","⚡","☄","☀","☾","☽","☯",
"☮","☘","☠","☢","✿","❀","❁","❂","❃","❇",
"❈","❉","❊","❋","◆","◇","◈","◉","○","●",
"▲","△","▼","▽","✤","✥","✣","✢","✜","✚",
"✙","✠","✟","♠","♡","♢","♣","♥","♦","『",
"』","「","」","【","】","〖","〗","༺","༻","꧁",
"꧂","乂","亗","〆","メ","ツ","么","彡"
];

let output = "const nameLibrary = {\n";

let used = new Set();

let styleNumber = 0;

for(let letter of alphabet){

output += "  " + letter + ": [\n";

let names = [];

let i = 0;

while(names.length < 1000){

let part = parts[(i + letter.charCodeAt(0)) % parts.length];

let symbol1 =
symbols[styleNumber % symbols.length];

let symbol2 =
symbols[Math.floor(styleNumber / symbols.length) % symbols.length];

if(symbol1 === symbol2){

symbol2 =
symbols[(Math.floor(styleNumber / symbols.length) + 1) % symbols.length];

}

let name =
symbol1 +
letter +
part +
symbol2;

if(!used.has(name)){

used.add(name);

names.push(name);

styleNumber++;

}

i++;

}

for(let n = 0; n < names.length; n++){

output +=
"    " +
JSON.stringify(names[n]) +
(n === names.length - 1 ? "" : ",") +
"\n";

}

output +=
"  ]" +
(letter === "Z" ? "" : ",") +
"\n";

}

output +=
"};\n\nwindow.nameLibrary = nameLibrary;\n";

const blob = new Blob(
[output],
{type:"application/javascript"}
);

const url = URL.createObjectURL(blob);

const link =
document.getElementById("download");

link.href = url;

link.download = "names.js";

link.style.display = "inline-block";

document.getElementById("status").innerText =
"✅ 26,000 names ready!";

});

</script>

</body>
</html>
